# Nightly build: every push to main builds all targets and updates a single rolling
# "nightly" pre-release whose assets are replaced each run. Not a versioned release.
name: nightly

on:
  push:
    branches: [main]

# Cancel an in-flight nightly if a newer push lands.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          SHA: ${{ github.sha }}
        run: echo "version=nightly-${SHA:0:7}" >> "$GITHUB_OUTPUT"

  # Which parts this push touched; only those are built. The Claude Code plugin counts
  # for both IDE clients, since each bundles it, and a workflow change counts for all,
  # so a CI edit is exercised once. The daemon builds whenever anything does: the IDE
  # packages pin its hashes. A push that touches none (docs, the lab) builds nothing
  # and leaves the previous nightly in place; otherwise the nightly carries only what
  # this push rebuilt.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any: ${{ steps.filter.outputs.changes != '[]' }}
      rust: ${{ steps.filter.outputs.rust }}
      vscode: ${{ steps.filter.outputs.vscode }}
      jetbrains: ${{ steps.filter.outputs.jetbrains }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/desktop/**'
              - 'apps/daemon/**'
              - 'packaging/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.github/workflows/**'
            vscode:
              - 'clients/vscode/**'
              - 'clients/claude-code/**'
              - '.github/workflows/**'
            jetbrains:
              - 'clients/jetbrains/**'
              - 'clients/claude-code/**'
              - '.github/workflows/**'

  build:
    needs: [version, changes]
    if: needs.changes.outputs.any == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      tag: nightly
      desktop: ${{ needs.changes.outputs.rust == 'true' }}
      vscode: ${{ needs.changes.outputs.vscode == 'true' }}
      jetbrains: ${{ needs.changes.outputs.jetbrains == 'true' }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Move the rolling `nightly` tag to this commit and clear the old release so
      # stale assets don't linger. `|| true` keeps the first-ever run from failing.
      - name: Reset nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --cleanup-tag --yes || true

      - name: Publish nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (${{ needs.version.outputs.version }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: "Rolling nightly build from `main` (${{ needs.version.outputs.version }}). Unstable."
          fail_on_unmatched_files: true
          files: artifacts/*

  # The same check release.yml runs, on the path that runs first.
  #
  # `build` is `continue-on-error` so a failed desktop target cannot stop the extensions
  # shipping — but that job lives in the shared build.yml, called by this workflow too,
  # while the compensating check existed only for tags. So a desktop failure on main
  # produced a green nightly with the .dmg silently missing: `fail_on_unmatched_files`
  # is satisfied by the daemons and .vsix alone. Nightly is the canary for main, and
  # that removed the signal exactly where it was cheapest to see.
  verify-desktop:
    needs: [version, changes, publish]
    # Only a nightly that built the desktop app is expected to carry it.
    if: always() && needs.publish.result == 'success' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the desktop assets reached the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # `--repo` because this job checks out nothing: `gh` otherwise infers the
          # repository from git remotes and fails with "not a git repository", which
          # this job then reported as a missing asset. Naming the repo is cheaper than
          # adding a checkout for one API call.
          assets="$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          echo "$assets"
          missing=0
          for expected in \
            "MoonlightCode-${VERSION}-aarch64-apple-darwin.dmg" \
            "MoonlightCode-${VERSION}-x86_64-apple-darwin.dmg" \
            "moonlight-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"; do
            if ! printf '%s\n' "$assets" | grep -qxF "$expected"; then
              echo "::error::missing desktop asset: $expected"
              missing=1
            fi
          done
          exit "$missing"
